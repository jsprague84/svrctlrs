# SvrCtlRS Android app (Tauri v2).
#
# Runs on the epyc-ai `android` runner in the tauri-android-ci image. master builds a debug APK
# and keeps it as a workflow artifact; a `v*` tag builds the release APK, signs it with the
# keystore held in repository secrets, and attaches it to the Forgejo release.
# Only /ci-cache/sccache is shared for cargo (see the forgejo-ci standard); npm and gradle
# caches lock properly and are shared too.

name: Android

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE*'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.forgejo/workflows/ci.yaml'
      - '.forgejo/workflows/docker.yaml'
      - '.forgejo/workflows/desktop.yaml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  android:
    name: Android APK
    runs-on: android
    container:
      image: git.js-node.cc/jsprague/tauri-android-ci:latest
      volumes:
        - /ci-cache/sccache:/sccache
        - /ci-cache/npm-cache:/root/.npm
        - /ci-cache/gradle:/root/.gradle
    steps:
      - name: Checkout
        run: |
          git clone --depth=50 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.js-node.cc/${GITHUB_REPOSITORY}.git" .
          git checkout --detach "${GITHUB_SHA}"

      - name: Install frontend dependencies
        run: cd ui && npm ci --no-audit --no-fund

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: cd ui && npm run tauri android build -- --debug --apk

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd ui && npm run tauri android build -- --apk

      - name: Sign release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the release APK stays unsigned."
            exit 0
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > /tmp/release.keystore
          UNSIGNED=$(find ui/src-tauri/gen/android -path "*/release/*-unsigned.apk" | head -1)
          [ -n "${UNSIGNED}" ] || { echo "no unsigned release APK found" >&2; exit 1; }
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" sign \
            --ks /tmp/release.keystore --ks-key-alias svrctlrs \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$(dirname "${UNSIGNED}")/svrctlrs-${GITHUB_REF_NAME}.apk" "${UNSIGNED}"
          rm -f /tmp/release.keystore
          echo "signed: $(dirname "${UNSIGNED}")/svrctlrs-${GITHUB_REF_NAME}.apk"

      - name: List artifacts
        run: find ui/src-tauri/gen/android -name '*.apk' -not -path '*/intermediates/*' -exec ls -lh {} \;

      - name: Keep the debug APK as a workflow artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: svrctlrs-android-debug-${{ github.sha }}
          path: ui/src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          retention-days: 14

      - name: Attach to the Forgejo release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          SIGNED=$(find ui/src-tauri/gen/android -name "svrctlrs-${GITHUB_REF_NAME}.apk" | head -1)
          [ -n "${SIGNED}" ] || SIGNED=$(find ui/src-tauri/gen/android -path "*/release/*-unsigned.apk" | head -1)
          scripts/ci/forgejo-release.sh "${GITHUB_REF_NAME}" "${SIGNED}"

      - name: Cache stats
        run: sccache --show-stats
