# SvrCtlRS CI — lint, audit, test, frontend.
#
# Runs on the epyc-ai `rust-high` runners (dev-space standard: never `runs-on: docker`).
# The svrctlrs-ci image is rust-ci plus Node 22, so both cargo and npm jobs use it.
# Only /ci-cache/sccache is shared between jobs; a shared cargo registry races at
# concurrency > 1 (see the forgejo-ci standard). The npm cache is safe to share.
#
# Feature branches build too — the runner is fast enough that waiting for a merge to
# discover a failure is wasted time. Images and app packages are built by docker.yaml,
# android.yaml and desktop.yaml, which are gated on master and tags.

name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint
    runs-on: rust-high
    container:
      image: git.js-node.cc/jsprague/svrctlrs-ci:latest
      volumes:
        - /ci-cache/sccache:/sccache
    steps:
      - name: Checkout
        # The CI image has no JS checkout action runtime path we trust, so clone by hand.
        # pull_request runs: GITHUB_REF_NAME is "<n>/merge" and GITHUB_SHA is a merge
        # commit that is not on any branch, so test the PR head instead. An AGit PR has no
        # head branch, only GITHUB_HEAD_REF=refs/pull/<n>/head, which `clone --branch`
        # cannot take; fetching the ref works for both kinds.
        run: |
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.js-node.cc/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git init -q . && git remote add origin "${URL}"
            git fetch -q --depth=50 origin "${GITHUB_HEAD_REF}" && git checkout -q --detach FETCH_HEAD
          else
            git clone --depth=50 --branch "${GITHUB_REF_NAME}" "${URL}" .
            git checkout --detach "${GITHUB_SHA}"
          fi

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cache stats
        run: sccache --show-stats

  audit:
    name: Audit
    runs-on: rust-high
    container:
      image: git.js-node.cc/jsprague/svrctlrs-ci:latest
      volumes:
        - /ci-cache/sccache:/sccache
    steps:
      - name: Checkout
        run: |
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.js-node.cc/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git init -q . && git remote add origin "${URL}"
            git fetch -q --depth=50 origin "${GITHUB_HEAD_REF}" && git checkout -q --detach FETCH_HEAD
          else
            git clone --depth=50 --branch "${GITHUB_REF_NAME}" "${URL}" .
            git checkout --detach "${GITHUB_SHA}"
          fi

      - name: Install cargo-audit
        run: cargo audit --version || cargo install cargo-audit --locked

      # Gate on any new advisory. Every `--ignore` needs a reason here and a ROADMAP entry.
      #   RUSTSEC-2023-0071: rsa Marvin timing attack; transitive via ssh-key, no fixed release.
      - name: Cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071

  test:
    name: Test
    runs-on: rust-high
    needs: lint
    container:
      image: git.js-node.cc/jsprague/svrctlrs-ci:latest
      volumes:
        - /ci-cache/sccache:/sccache
    steps:
      - name: Checkout
        run: |
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.js-node.cc/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git init -q . && git remote add origin "${URL}"
            git fetch -q --depth=50 origin "${GITHUB_HEAD_REF}" && git checkout -q --detach FETCH_HEAD
          else
            git clone --depth=50 --branch "${GITHUB_REF_NAME}" "${URL}" .
            git checkout --detach "${GITHUB_SHA}"
          fi

      - name: Run tests
        run: cargo test --workspace

      - name: Cache stats
        run: sccache --show-stats

  frontend:
    name: Frontend
    runs-on: rust-high
    container:
      image: git.js-node.cc/jsprague/svrctlrs-ci:latest
      volumes:
        - /ci-cache/npm-cache:/root/.npm
    steps:
      - name: Checkout
        run: |
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.js-node.cc/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git init -q . && git remote add origin "${URL}"
            git fetch -q --depth=50 origin "${GITHUB_HEAD_REF}" && git checkout -q --detach FETCH_HEAD
          else
            git clone --depth=50 --branch "${GITHUB_REF_NAME}" "${URL}" .
            git checkout --detach "${GITHUB_SHA}"
          fi

      - name: Install dependencies
        run: cd ui && npm ci --no-audit --no-fund

      - name: Svelte check
        run: cd ui && npm run check

      - name: Lint (eslint + prettier)
        run: cd ui && npm run lint

      - name: Unit tests
        run: cd ui && npm run test

      - name: Build
        run: cd ui && npm run build

      - name: npm audit (production dependencies)
        run: cd ui && npm audit --omit=dev --audit-level=high
