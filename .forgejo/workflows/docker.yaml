# SvrCtlRS server image — build on epyc-ai, publish to the Forgejo registry, deploy master.
#
# Standard dev-space image pipeline (see the forgejo-ci standard):
#   - `build` runner + catthehacker image; Docker comes from the runner's DinD sidecar at
#     tcp://docker:2375 (injected as DOCKER_HOST — never mount a socket or TLS certs here).
#   - Registry login with the inherited user-level FORGEJO_REGISTRY_TOKEN_ALL secret.
#   - One multi-arch image (linux/amd64 + linux/arm64, cross-compiled, no emulation).
#   - Every build is tagged with the short and full commit SHA and stamped with
#     org.opencontainers.image.revision, so a deploy can prove which commit is running.
#   - master also gets :latest and auto-deploys to docker-vm over a forced-command SSH key;
#     then hermes installs the skill and svrctl of what was deployed (another forced command).
#   - A tag publishes :vX.Y.Z (+ :latest) and a Forgejo release, and never deploys: a tag is a
#     release artifact, not necessarily what should be live.

name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
    # prose, but NOT skills/: hermes is sent the skill after each deploy (the agents job).
    # Named place by place: Forgejo creates no run at all for a paths-ignore with a `!` pattern
    # (LogosOS, 2026-10-30). scripts/dev/ci-watch.sh has the same list.
    paths-ignore:
      - '*.md'
      - '.forgejo/**.md'
      - 'scripts/eval/hermes/README.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE*'
      - '.forgejo/workflows/ci.yaml'
      - '.forgejo/workflows/desktop.yaml'
  workflow_dispatch:

env:
  IMAGE: git.js-node.cc/jsprague/svrctlrs

jobs:
  build:
    name: Build & Push
    runs-on: build
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      # A named builder that outlives the job. The default (a new builder-<uuid> per run, removed
      # afterwards) threw BuildKit's cache away every time, so cargo-chef and sccache never had
      # a warm cache. The builder lives in the shared forgejo-dind daemon; created once, later
      # runs find its container and state volume (buildx_buildkit_svrctlrs0) and reuse them.
      # Its cache is capped (garbage collection at 20 GB) because epyc-ai's disk is shared.
      - name: Set up Docker Buildx (persistent builder)
        uses: https://github.com/docker/setup-buildx-action@v3
        with:
          name: svrctlrs
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              gckeepstorage = "20GB"

      - name: Log in to the Forgejo container registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: git.js-node.cc
          username: ${{ github.actor }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN_ALL }}

      - name: Compute image tags
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAGS="${IMAGE}:${GITHUB_SHA::7},${IMAGE}:${GITHUB_SHA}"
          case "${GITHUB_REF}" in
            refs/heads/master) TAGS="${IMAGE}:latest,${TAGS}" ;;
            refs/tags/*)       TAGS="${IMAGE}:latest,${IMAGE}:${GITHUB_REF_NAME},${TAGS}" ;;
          esac
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "publishing: ${TAGS}"

      - name: Build and push
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          # Both cross-compiled on this amd64 runner (see the Dockerfile): no QEMU involved
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SVRCTLRS_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=SvrCtlRS
          tags: ${{ steps.tag.outputs.tags }}

  release:
    name: Forgejo release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: build
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      # The tag equals every manifest's version and CHANGELOG.md has its section (the notes)
      - name: Tag, manifests and CHANGELOG agree
        run: scripts/ci/check-version.sh "${GITHUB_REF_NAME}"

      - name: Log in to the Forgejo container registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: git.js-node.cc
          username: ${{ github.actor }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN_ALL }}

      # svrctl on its own, for agents on other machines: copied out of the image just
      # published (created, never run, so arm64 needs no emulation)
      - name: Take svrctl out of the image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            id=$(docker create --platform "linux/${arch}" "${IMAGE}:${GITHUB_REF_NAME}")
            docker cp "${id}:/app/svrctl" "dist/svrctl-linux-${arch}"
            docker rm "${id}" >/dev/null
          done
          (cd dist && sha256sum svrctl-linux-* > svrctl-SHA256SUMS && cat svrctl-SHA256SUMS)

      - name: Create or update the release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          scripts/ci/forgejo-release.sh "${GITHUB_REF_NAME}" \
            dist/svrctl-linux-amd64 dist/svrctl-linux-arm64 dist/svrctl-SHA256SUMS

  deploy:
    name: Deploy to docker-vm
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: build
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      # CI runs beside the image build. Do not put an unlinted, untested commit live: wait for
      # this commit's CI jobs and refuse unless every one of them is green. Only the push
      # runs count: a release PR's own run reports on the same commit as "(pull_request)".
      - name: Wait for the CI gates on this commit
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          url="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status"
          for _ in $(seq 1 120); do
            states=$(curl -fsS -H "Authorization: token ${TOKEN}" "${url}" \
              | jq -r '[.statuses[] | select(.context | startswith("CI / ") and endswith("(push)")) | .status] | join(" ")' || true)
            case " ${states} " in
              *" failure "*|*" error "*) echo "CI failed for ${GITHUB_SHA}: ${states}" >&2; exit 1 ;;
            esac
            total=$(echo "${states}" | wc -w)
            green=$(echo "${states}" | tr ' ' '\n' | grep -c '^success$' || true)
            # four CI jobs: Lint, Audit, Test, Frontend
            if [ "${total}" -ge 4 ] && [ "${green}" -eq "${total}" ]; then
              echo "CI green: ${states}"; exit 0
            fi
            sleep 15
          done
          echo "CI did not finish within 30 minutes: ${states}" >&2
          exit 1

      # The key is restricted on docker-vm to a forced command (scripts/deploy/docker-vm-deploy.sh)
      # that only accepts a commit SHA. Setup is documented in docs/DEPLOYMENT.md.
      - name: Deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.DOCKER_VM_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::notice::DOCKER_VM_DEPLOY_KEY is not set; image published, deploy skipped."
            exit 0
          fi
          command -v ssh >/dev/null || { apt-get update -qq && apt-get install -y -qq openssh-client; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo '192.168.5.172 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGmOh7GDvBC5lBrP6AQ4J2NMRi5PXAqGC9io/BPO4He8' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            ubuntu@192.168.5.172 "${GITHUB_SHA}"

  # The agent interface on hermes follows each deploy (docs/agents.md, "Kept current"): the
  # skill copies (Hermes, Claude Code), ~/svrctlrs-eval/bin/svrctl and the eval harness. The key
  # (HERMES_AGENT_SYNC_KEY) is bound on hermes to a forced command
  # (scripts/deploy/hermes-agent-sync.sh) and sends the SHA, nothing else: hermes refuses unless
  # production runs it, and takes svrctl from that commit's image and the skill from the
  # repository at that commit. Setup: docs/DEPLOYMENT.md, "Agent interface on hermes".
  agents:
    name: Agent interface on hermes
    needs: deploy
    if: github.ref == 'refs/heads/master'
    runs-on: build
    timeout-minutes: 10
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Install on hermes
        env:
          SYNC_KEY: ${{ secrets.HERMES_AGENT_SYNC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_KEY}" ]; then
            echo "::notice::HERMES_AGENT_SYNC_KEY is not set (docs/DEPLOYMENT.md); hermes not synced."
            exit 0
          fi
          command -v ssh >/dev/null || { apt-get update -qq && apt-get install -y -qq openssh-client; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SYNC_KEY}" > ~/.ssh/agent_sync && chmod 600 ~/.ssh/agent_sync
          echo '10.10.1.35 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIByM+PJdYivB7dgfebxhWQvNeL75Fi7NPvV0s7KCggxd' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/agent_sync -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            ubuntu@10.10.1.35 "${GITHUB_SHA}" < /dev/null
