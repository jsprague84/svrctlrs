# SvrCtlRS Docker Image Build
#
# Builds and pushes the web UI Docker image to the Forgejo registry.
# Triggered on main/master push and version tags.

name: Docker

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: git.js-node.cc
  IMAGE_NAME: jsprague/svrctlrs

jobs:
  docker:
    name: Build & Push
    runs-on: docker
    container:
      image: docker:27
      volumes:
        - /certs/client:/certs/client:ro
      env:
        DOCKER_HOST: tcp://docker:2376
        DOCKER_TLS_VERIFY: "1"
        DOCKER_CERT_PATH: /certs/client
    steps:
      - name: Checkout
        run: |
          apk add --no-cache git
          git clone --depth=1 --branch=${GITHUB_REF_NAME} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git . 2>/dev/null || \
          (git clone --depth=50 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git . && git checkout ${GITHUB_SHA})

      - name: Login to Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u jsprague --password-stdin

      - name: Build and tag
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          REF="${GITHUB_REF_NAME}"
          SHA=$(echo "${GITHUB_SHA}" | head -c 7)

          # Build the image
          docker build -t "${REPO}:build" .

          # Determine and apply tags
          if echo "${GITHUB_REF}" | grep -q "refs/tags/v"; then
            VERSION="${REF#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f1-2)
            for TAG in latest "${VERSION}" "${MINOR}" "v${MAJOR}" "sha-${SHA}"; do
              docker tag "${REPO}:build" "${REPO}:${TAG}"
              docker push "${REPO}:${TAG}"
            done
          elif [ "$REF" = "main" ] || [ "$REF" = "master" ]; then
            for TAG in latest "sha-${SHA}"; do
              docker tag "${REPO}:build" "${REPO}:${TAG}"
              docker push "${REPO}:${TAG}"
            done
          else
            for TAG in "${REF}" "sha-${SHA}"; do
              docker tag "${REPO}:build" "${REPO}:${TAG}"
              docker push "${REPO}:${TAG}"
            done
          fi

  release:
    name: Release
    runs-on: docker
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    container:
      image: git.js-node.cc/jsprague/rust-ci:latest
    steps:
      - name: Create Forgejo release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"

          BODY="## SvrCtlRS ${TAG}

          ### Docker
          \`\`\`bash
          docker pull git.js-node.cc/jsprague/svrctlrs:${TAG#v}
          \`\`\`

          ### Install
          See release assets for desktop and mobile packages."

          curl -sf -X POST "${API}/releases" \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"SvrCtlRS ${TAG}\",\"body\":$(echo "$BODY"|jq -Rs .),\"draft\":false,\"prerelease\":false}"

          echo "Published release ${TAG}"
