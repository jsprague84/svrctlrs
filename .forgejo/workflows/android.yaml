# SvrCtlRS Tauri Android Build
#
# Builds debug APK (all pushes to main) and signed APK/AAB (tags).
# Attaches artifacts to the Forgejo release on version tags.

name: Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  android:
    name: Android APK
    runs-on: docker
    container:
      image: git.js-node.cc/jsprague/tauri-android-ci:latest
      volumes:
        - /ci-cache/sccache:/sccache
        - /ci-cache/cargo-registry:/usr/local/cargo/registry
        - /ci-cache/npm-cache:/root/.npm
        - /ci-cache/gradle:/root/.gradle
    steps:
      - name: Checkout
        run: |
          git clone --depth=1 --branch=${GITHUB_REF_NAME} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git . 2>/dev/null || \
          (git clone --depth=50 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git . && git checkout ${GITHUB_SHA})

      - name: Install frontend dependencies
        run: cd ui && npm ci

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: cd ui && npm run tauri android build -- --debug

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd ui && npm run tauri android build

      - name: List artifacts
        run: |
          echo "=== Built APKs ==="
          find ui/src-tauri/gen/android -name "*.apk" -o -name "*.aab" | sort
          find ui/src-tauri/gen/android -name "*.apk" -exec ls -lh {} \;

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"

          echo "API: ${API}"
          echo "TAG: ${TAG}"
          echo "TOKEN set: $([ -n "$TOKEN" ] && echo yes || echo NO)"

          # Get or create release
          RELEASE_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" "${API}/releases/tags/${TAG}" \
            -H "Authorization: token ${TOKEN}")
          HTTP_CODE=$(echo "$RELEASE_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          BODY=$(echo "$RELEASE_RESPONSE" | grep -v "HTTP_CODE:")
          echo "Get release response (HTTP ${HTTP_CODE}): ${BODY}"

          RELEASE_ID=$(echo "$BODY" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating release..."
            BODY=$(curl -s -X POST "${API}/releases" \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"SvrCtlRS ${TAG}\",\"draft\":false,\"prerelease\":false}")
            echo "Create release response: ${BODY}"
            RELEASE_ID=$(echo "$BODY" | jq -r '.id // empty')
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Could not get or create release"
            exit 1
          fi

          echo "Uploading to release ${RELEASE_ID}..."

          for apk in $(find ui/src-tauri/gen/android -name "*.apk" | grep -v "intermediates"); do
            NAME=$(basename "$apk")
            echo "  Uploading ${NAME}..."
            UPLOAD_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
              "${API}/releases/${RELEASE_ID}/assets?name=${NAME}" \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${apk}")
            echo "  Response: $(echo "$UPLOAD_RESPONSE" | grep "HTTP_CODE:")"
          done

          echo "Android artifacts uploaded."

      - name: Cache stats
        run: sccache --show-stats
