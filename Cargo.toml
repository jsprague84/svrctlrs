[workspace]
resolver = "2"
members = [
    "core",
    "server",
    "database",
]
exclude = [
    "ui/src-tauri",
]

[workspace.package]
# 3.x is the terminal/SSH product (SvelteKit + Tauri). 1.x/2.x tags were the retired
# monitoring platform; the version is shared by the server, the UI and the Tauri apps.
version = "3.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://git.js-node.cc/jsprague/svrctlrs"
authors = ["Johnathon Sprague"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "fs", "set-header"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }

# Error handling
anyhow = "1"
thiserror = "1.0"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# SSH for remote execution
async-ssh2-tokio = "0.8"
# SSH with PTY support for interactive sessions
russh = "0.51"
russh-keys = "0.48"

# WebSocket support
futures-util = "0.3"

# Environment
dotenvy = "0.15"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Internal workspace crates
svrctlrs-core = { path = "core" }
svrctlrs-database = { path = "database" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
