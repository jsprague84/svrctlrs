# Optional server configuration, loaded with `svrctlrs-server --config config/example.toml`.
# Most deployments use environment variables instead (see docs/DEPLOYMENT.md); the Docker
# image does not pass --config. Notification settings live in the database (Settings UI),
# not here.

# Overrides DATABASE_URL.
database_url = "sqlite:data/svrctlrs.db"

# Default SSH key path for credentials that do not specify one. Overrides SSH_KEY_PATH.
# ssh_key_path = "/home/svrctlrs/.ssh/id_ed25519"

# Servers are managed through the UI/API; this list exists for compatibility and may be empty.
servers = []
