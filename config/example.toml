# SvrCtlRS Server Configuration Example
#
# SvrCtlRS is a terminal/SSH management tool for remote server access.
# Servers and credentials are managed via the web UI, not this config file.
#
# Copy this file to config.toml and update values for your environment.

# Database configuration
database_url = "sqlite:data/svrctlrs.db"

# SSH key for remote server execution (fallback if no credential assigned)
ssh_key_path = "/home/user/.ssh/id_rsa"

# Notification configuration (optional)
[notifications]
# Gotify configuration
gotify_url = "https://gotify.example.com"
gotify_key = "your-gotify-key"

# ntfy.sh configuration
ntfy_url = "https://ntfy.sh"
ntfy_topic = "svrctlrs-notifications"
