[package]
name = "svrctlrs-desktop"
version = "4.0.0"
description = "SvrCtlRS Desktop — Terminal/SSH management tool"
authors = ["Johnathon Sprague"]
license = "MIT"
repository = "https://git.js-node.cc/jsprague/svrctlrs"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-biometric = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
# Sign-in through the system browser (ROADMAP 22): open it, listen on 127.0.0.1, PKCE
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "io-util", "time"] }
url = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
# The session token in the OS keyring instead of localStorage
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
