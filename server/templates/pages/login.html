<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SvrCtlRS</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">

    <!-- Prevent FOUC - Set theme immediately -->
    <script>
        const theme = localStorage.getItem('theme') || 'tokyo';
        document.documentElement.setAttribute('data-theme', theme);
    </script>

    <link rel="stylesheet" href="/static/css/styles-technical.css">
    <script defer src="/static/js/htmx.min.js"></script>
</head>
<body>
<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="card" style="max-width: 400px; width: 100%; margin: 0 1rem;">
        <h1 class="text-center" style="margin-bottom: 1.5rem;">SvrCtlRS</h1>

        {% match error %}
        {% when Some with (e) %}
        <div class="alert alert-error" style="margin-bottom: 1rem;">{{ e }}</div>
        {% when None %}
        {% endmatch %}

        <form hx-post="/auth/login"
              hx-target="body"
              hx-swap="outerHTML">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       required
                       autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Login
            </button>
        </form>
    </div>
</div>
</body>
</html>
