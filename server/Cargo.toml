[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "svrctl"
path = "src/bin/svrctl/main.rs"

[dependencies]
# Internal crates (server-only - contain tokio, sqlx, etc.)
svrctlrs-api = { workspace = true }
svrctlrs-core = { workspace = true, optional = true }
svrctlrs-database = { workspace = true, optional = true }

# Async (optional for server)
tokio = { workspace = true, optional = true }

# Web framework (optional for server)
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true, features = ["util"] }
tower-http = { workspace = true, optional = true }

# Session management for auth
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"], optional = true }
time = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# OpenAPI document (GET /api/v1/openapi.json, docs/openapi.json)
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

# Error handling (server-only)
anyhow = { workspace = true, optional = true }

# Logging (server-only, optional for WASM compatibility)
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# Environment (server-only)
dotenvy = { workspace = true, optional = true }

# CLI (server-only)
clap = { workspace = true, optional = true }

# HTTP client (server-only)
reqwest = { workspace = true, optional = true }

# SSH client (server-only)
# SSH with PTY support for interactive sessions
russh = { workspace = true, optional = true }

# Date/time (server-only)
chrono = { workspace = true, optional = true }

# WebSocket support
futures-util = { workspace = true, optional = true }
tempfile = "3.23.0"
# One-time WebSocket tickets (random bytes, base64url)
rand = "0.8"
base64 = "0.22"
# `svrctl reset-password`: read the new password without echoing it
rpassword = "7"
# OpenSSH-style SHA256 host key fingerprints
sha2 = "0.10"
russh-sftp = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[features]
# Default: Server feature
default = ["server"]

# Server feature (default for binary)
server = [
    # Internal crates (server-only)
    "dep:svrctlrs-core",
    "dep:svrctlrs-database",
    # Server dependencies
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tower-sessions-sqlx-store",
    "dep:anyhow",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:dotenvy",
    "dep:clap",
    "dep:reqwest",
    "dep:russh",
    "dep:russh-sftp",
    "dep:tokio-util",
    "dep:chrono",
    "dep:futures-util"
]

[dev-dependencies]
# `oneshot` for driving the router in middleware tests
tower = { workspace = true, features = ["util"] }
# A WebSocket client for the end-to-end token test (axum's own WebSocket crate, same version)
tokio-tungstenite = "0.28"
futures-util = { workspace = true }
