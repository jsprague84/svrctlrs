services:
  svrctlrs:
    image: ghcr.io/${GITHUB_REPOSITORY:-jsprague84/svrctlrs}:${TAG:-dev}
    container_name: svrctlrs
    restart: ${RESTART_POLICY:-unless-stopped}
    user: "1000:${DOCKER_GID:-987}"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_URL=${DATABASE_URL:-sqlite:/app/data/svrctlrs.db}
      - SPA_DIR=/app/ui/build
      - SESSION_SECURE=true
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (64 hex chars for AES-256-GCM)}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    volumes:
      - svrctlrs-data:/app/data
      - ${SSH_KEY_PATH:-~/.ssh}:/home/svrctlrs/.ssh:ro
    healthcheck:
      test: ["CMD", "/app/svrctl", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # HTTP -> HTTPS redirect
      - "traefik.http.routers.svrctlrs.entrypoints=http"
      - "traefik.http.routers.svrctlrs.rule=Host(`svrctlrs.js-node.app`)"
      - "traefik.http.middlewares.svrctlrs-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.svrctlrs.middlewares=svrctlrs-https-redirect"

      # HTTPS router
      - "traefik.http.routers.svrctlrs-secure.entrypoints=https"
      - "traefik.http.routers.svrctlrs-secure.rule=Host(`svrctlrs.js-node.app`)"
      - "traefik.http.routers.svrctlrs-secure.tls=true"
      - "traefik.http.routers.svrctlrs-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.svrctlrs-secure.service=svrctlrs"
      - "traefik.http.routers.svrctlrs-secure.middlewares=ta-jsapp-forwardauth@docker"

      - "traefik.http.services.svrctlrs.loadbalancer.server.port=8080"

volumes:
  svrctlrs-data:
    driver: local

networks:
  proxy:
    external: true
