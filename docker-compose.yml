# SvrCtlRS behind the docker-vm Traefik edge.
#
# Copy to ~/docker-compose/svrctlrs/ with a .env (chmod 600) that sets at least
# ADMIN_PASSWORD and ENCRYPTION_KEY; see docs/DEPLOYMENT.md and .env.example.
# TAG is normally a short commit SHA written by scripts/deploy/docker-vm-deploy.sh,
# or a release tag such as v3.0.0.
#
# Edge auth (dev-space standard): everything a browser loads (UI, API and WebSockets) sits
# behind the Pocket ID passkey login (`secure-auth-chain@file`), then the app's own login.
# Two narrow routers skip it: requests carrying an API token (`Authorization: Bearer svr_…`,
# agents and scripts, never a login), and the health check (version and revision only).
services:
  svrctlrs:
    image: git.js-node.cc/jsprague/svrctlrs:${TAG:-latest}
    container_name: svrctlrs
    restart: ${RESTART_POLICY:-unless-stopped}
    user: "1000:1000"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_URL=${DATABASE_URL:-sqlite:/app/data/svrctlrs.db}
      - SPA_DIR=/app/ui/build
      - SESSION_SECURE=true
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (64 hex chars for AES-256-GCM)}
      # Origins of non-browser clients (Tauri desktop/Android). Leave empty for browser-only use.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Sign-in with an OpenID Connect provider (optional) and whether passwords are taken
      - PUBLIC_URL=${PUBLIC_URL:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_NAME=${OIDC_NAME:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-}
      - OIDC_ALLOWED_GROUPS=${OIDC_ALLOWED_GROUPS:-}
      - PASSWORD_LOGIN=${PASSWORD_LOGIN:-on}
    volumes:
      - svrctlrs-data:/app/data
      # Optional: SSH keys the server may use for key-path credentials. Mount a dedicated
      # directory, not your whole ~/.ssh.
      - ${SSH_KEY_PATH:-./ssh}:/home/svrctlrs/.ssh:ro
    healthcheck:
      test: ["CMD", "/app/svrctl", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.svrctlrs.loadbalancer.server.port=8080"

      # Browsers: passkey login at the edge for every path, then the app's own login.
      - "traefik.http.routers.svrctlrs-secure.entrypoints=https"
      - "traefik.http.routers.svrctlrs-secure.rule=Host(`${SVRCTLRS_HOST:-svrctlrs.js-node.app}`)"
      - "traefik.http.routers.svrctlrs-secure.tls=true"
      - "traefik.http.routers.svrctlrs-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.svrctlrs-secure.service=svrctlrs"
      - "traefik.http.routers.svrctlrs-secure.middlewares=secure-auth-chain@file"

      # Agents and scripts (svrctl, Hermes): a request carrying an API token is judged by that
      # token alone in the app, so it needs no passkey. Never the login: the rule leaves it
      # out, and the app refuses a login that carries an Authorization header anyway.
      - "traefik.http.routers.svrctlrs-token.entrypoints=https"
      - "traefik.http.routers.svrctlrs-token.rule=Host(`${SVRCTLRS_HOST:-svrctlrs.js-node.app}`) && (PathPrefix(`/api/`) || PathPrefix(`/ws/`)) && !PathPrefix(`/api/v1/auth/login`) && HeaderRegexp(`Authorization`, `^Bearer svr_`)"
      - "traefik.http.routers.svrctlrs-token.priority=200"
      - "traefik.http.routers.svrctlrs-token.tls=true"
      - "traefik.http.routers.svrctlrs-token.tls.certresolver=cloudflare"
      - "traefik.http.routers.svrctlrs-token.service=svrctlrs"
      - "traefik.http.routers.svrctlrs-token.middlewares=secure-chain@file"

      # Health check for monitors and the deploy check: version and revision, nothing else.
      - "traefik.http.routers.svrctlrs-health.entrypoints=https"
      - "traefik.http.routers.svrctlrs-health.rule=Host(`${SVRCTLRS_HOST:-svrctlrs.js-node.app}`) && Path(`/api/v1/health`)"
      - "traefik.http.routers.svrctlrs-health.priority=200"
      - "traefik.http.routers.svrctlrs-health.tls=true"
      - "traefik.http.routers.svrctlrs-health.tls.certresolver=cloudflare"
      - "traefik.http.routers.svrctlrs-health.service=svrctlrs"
      - "traefik.http.routers.svrctlrs-health.middlewares=secure-chain@file"

volumes:
  svrctlrs-data:
    driver: local

networks:
  proxy:
    external: true
