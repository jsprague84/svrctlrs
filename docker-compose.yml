# SvrCtlRS behind the docker-vm Traefik edge.
#
# Copy to ~/docker-compose/svrctlrs/ with a .env (chmod 600) that sets at least
# ADMIN_PASSWORD and ENCRYPTION_KEY; see docs/DEPLOYMENT.md and .env.example.
# TAG is normally a short commit SHA written by scripts/deploy/docker-vm-deploy.sh,
# or a release tag such as v3.0.0.
#
# Edge auth (dev-space standard: an app with native OIDC skips forward auth): SvrCtlRS signs
# people in with Pocket ID itself (OIDC_* in .env) and takes no passwords (PASSWORD_LOGIN=off),
# so one router with security headers only serves everything — browsers, the desktop app and
# agents' API tokens alike. Without a provider, keep password sign-in behind a login proxy
# instead (docs/DEPLOYMENT.md, "Reverse proxy and edge auth").
services:
  svrctlrs:
    image: git.js-node.cc/jsprague/svrctlrs:${TAG:-latest}
    container_name: svrctlrs
    restart: ${RESTART_POLICY:-unless-stopped}
    user: "1000:1000"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_URL=${DATABASE_URL:-sqlite:/app/data/svrctlrs.db}
      - SPA_DIR=/app/ui/build
      - SESSION_SECURE=true
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (64 hex chars for AES-256-GCM)}
      # Origins of non-browser clients (Tauri desktop/Android). Leave empty for browser-only use.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Sign-in with an OpenID Connect provider (optional) and whether passwords are taken
      - PUBLIC_URL=${PUBLIC_URL:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_NAME=${OIDC_NAME:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-}
      - OIDC_ALLOWED_GROUPS=${OIDC_ALLOWED_GROUPS:-}
      # off by default here: this compose has no login proxy in front, so the provider is the way
      # in (the server will not start with it off and no OIDC_ISSUER set)
      - PASSWORD_LOGIN=${PASSWORD_LOGIN:-off}
    volumes:
      - svrctlrs-data:/app/data
      # Optional: SSH keys the server may use for key-path credentials. Mount a dedicated
      # directory, not your whole ~/.ssh.
      - ${SSH_KEY_PATH:-./ssh}:/home/svrctlrs/.ssh:ro
    healthcheck:
      test: ["CMD", "/app/svrctl", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.svrctlrs.loadbalancer.server.port=8080"

      # One router, headers only: the app is the login (Pocket ID passkey via OIDC; API tokens
      # for agents). Turning PASSWORD_LOGIN back on for break-glass opens the password form to
      # the internet: do that from the LAN, or put secure-auth-chain@file here meanwhile.
      - "traefik.http.routers.svrctlrs.entrypoints=https"
      - "traefik.http.routers.svrctlrs.rule=Host(`${SVRCTLRS_HOST:-svrctlrs.js-node.app}`)"
      - "traefik.http.routers.svrctlrs.tls=true"
      - "traefik.http.routers.svrctlrs.tls.certresolver=cloudflare"
      - "traefik.http.routers.svrctlrs.service=svrctlrs"
      - "traefik.http.routers.svrctlrs.middlewares=secure-chain@file"

volumes:
  svrctlrs-data:
    driver: local

networks:
  proxy:
    external: true
